name: EduVerse .NET CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore EduVerse.slnx
      - name: Build
        run: dotnet build EduVerse.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test EduVerse.slnx --no-build --configuration Release --verbosity normal
