name: EduVerse Mobile Android CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android MAUI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify runner Android SDK
        run: |
          test -d "${ANDROID_HOME:?Android SDK missing on runner}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Display tooling
        run: |
          dotnet --info
          dotnet workload list
      - name: Restore Android target
        run: dotnet restore mobile/EduVerse.Mobile/EduVerse.Mobile.csproj -p:TargetFrameworks=net10.0-android -r android-arm64
      - name: Build Android application
        run: dotnet build mobile/EduVerse.Mobile/EduVerse.Mobile.csproj --no-restore --configuration Release -f net10.0-android -r android-arm64 -p:TargetFrameworks=net10.0-android
      - name: Package Android debug APK for device QA
        run: dotnet publish mobile/EduVerse.Mobile/EduVerse.Mobile.csproj --configuration Debug -f net10.0-android -r android-arm64 -p:TargetFrameworks=net10.0-android -p:AndroidPackageFormats=apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduverse-android-arm64-debug-apk
          path: mobile/EduVerse.Mobile/bin/Debug/net10.0-android/android-arm64/**/*.apk
          if-no-files-found: error
          retention-days: 7
