name: EduVerse .NET CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: eduverse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      EDUVERSE_TEST_MYSQL: "Server=127.0.0.1;Port=3306;Database=eduverse_test;User ID=root;Password=ci_root_only;SslMode=None"
      Authentication__Issuer: "EduVerse.CI"
      Authentication__Audience: "EduVerse.API.CI"
      Authentication__SigningKey: "ci-only-not-production--EduVerse--random-placeholder--key-2026!"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Apply migrations 001, 002 and 003
        run: |
          mysql -h 127.0.0.1 -u root -pci_root_only eduverse_test < database/migrations/001_tenant_foundation.sql
          mysql -h 127.0.0.1 -u root -pci_root_only eduverse_test < database/migrations/002_identity_security.sql
          mysql -h 127.0.0.1 -u root -pci_root_only eduverse_test < database/migrations/003_api_operations.sql
      - name: Restore
        run: dotnet restore EduVerse.slnx
      - name: Build
        run: dotnet build EduVerse.slnx --no-restore --configuration Release
      - name: Verify CI database integration configuration
        run: test -n "$EDUVERSE_TEST_MYSQL"
      - name: Test all projects against MySQL
        run: dotnet test EduVerse.slnx --no-build --configuration Release --verbosity normal
      - name: Verify publishable deployments
        run: |
          dotnet publish src/EduVerse.Api/EduVerse.Api.csproj -c Release --no-restore -o /tmp/eduverse-api
          dotnet publish src/EduVerse.Web/EduVerse.Web.csproj -c Release --no-restore -o /tmp/eduverse-portal
          dotnet publish src/EduVerse.Ams.Web/EduVerse.Ams.Web.csproj -c Release --no-restore -o /tmp/eduverse-ams
          dotnet publish src/EduVerse.Hrms.Web/EduVerse.Hrms.Web.csproj -c Release --no-restore -o /tmp/eduverse-hrms
